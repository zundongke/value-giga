# Three ALOHA tasks aligned with labeling/milestones_vlm_all.jsonl.
# Replace every /path/to/... value. Episode counts/order must match the
# included labels: coffee 30..79, towel 80..129, candy 130..179.
common:
  num_latent_frames: 7
  video_height: 384
  video_width: 320

dataset:
  tasks:
    - task_id: stack_box
      t5_embedding_path: /path/to/coffee_task_embedding.pt
      data_paths: [/path/to/aloha_static_coffee]
    - task_id: fold_clothes
      t5_embedding_path: /path/to/towel_task_embedding.pt
      data_paths: [/path/to/aloha_static_towel]
    - task_id: toilet_paper
      t5_embedding_path: /path/to/candy_task_embedding.pt
      data_paths: [/path/to/aloha_static_candy]
  compute_state_stats: true
  future_offset: 50
  max_samples: null
  milestones_jsonl: labeling/milestones_vlm_all.jsonl
  subdataset_ep_offsets: [30, 80, 130]
  dual_slope_r: 7.0

model:
  wan:
    config_path: weights/Wan2.2-TI2V-5B
    checkpoint_path: weights/Wan2.2-TI2V-5B
    vae_path: weights/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    precision: bfloat16
    num_layers: 30

training:
  batch_size: 2
  max_steps: null
  max_epochs: 1
  learning_rate: 4.0e-5
  wan_learning_rate: 4.0e-5
  weight_decay: 0.01
  gradient_accumulation_steps: 12
  loss_weight_future_state: 0.5
  loss_weight_value: 1.0
  scheduler_type: linear
  warmup_steps: 100
  cycle_length: 100000
  f_max: 1.0
  f_min: 0.1
  grad_clip_norm: 1.0
  use_amp: true

system:
  checkpoint_dir: checkpoints
  log_level: INFO
  log_interval: 50
  save_interval: 1000
  num_workers: 4
  pin_memory: true

logging:
  report_to: tensorboard
  tensorboard_log_dir: tensorboard
  run_name: viva-aloha-example

resume:
  checkpoint_path: null
  reset_step: false
